<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1c2230">
  <title>こうかばつぐんクイズ</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- タイトル -->
  <section id="screen-title" class="screen">
    <div class="title-box">
      <div class="type-stripe"></div>
      <div id="hero" class="hero" aria-hidden="true"></div>
      <h1 class="title-logo">こうかばつぐん<span>クイズ</span></h1>
      <p class="lead">相手のポケモンに一番通りがいい技を選ぼう！<br>特性にも注意。</p>
      <div class="mode-switch" role="radiogroup" aria-label="モード">
        <button role="radio" data-mode="ten" aria-checked="true">10問チャレンジ</button>
        <button role="radio" data-mode="endless" aria-checked="false">エンドレス</button>
      </div>
      <p id="mode-desc" class="mode-desc"></p>
      <div class="difficulty">
        <button class="btn btn-primary" data-difficulty="easy">
          かんたん<small>タイプを表示</small>
        </button>
        <button class="btn btn-primary" data-difficulty="normal">
          ふつう<small>タイプを表示しない</small>
        </button>
      </div>
      <table class="highscores">
        <caption>ハイスコア</caption>
        <thead>
          <tr><th></th><th>10問</th><th>エンドレス</th></tr>
        </thead>
        <tbody>
          <tr><th>かんたん</th><td id="hs-ten-easy">-</td><td id="hs-endless-easy">-</td></tr>
          <tr><th>ふつう</th><td id="hs-ten-normal">-</td><td id="hs-endless-normal">-</td></tr>
        </tbody>
      </table>
      <div>
        <button class="sound-toggle btn-text" type="button"></button>
      </div>
      <div class="type-stripe" style="margin-top: 24px"></div>
    </div>
  </section>

  <!-- 出題 -->
  <section id="screen-quiz" class="screen" hidden>
    <header class="quiz-header">
      <button id="quit-button" class="btn-text" type="button">✕ やめる</button>
      <span id="progress">1 / 10</span>
      <span id="score">正解 0</span>
      <button class="sound-toggle btn-text" type="button"></button>
    </header>

    <div class="enemy">
      <div class="enemy-info">
        <div class="enemy-name">
          <span id="enemy-mega" class="mega-badge" hidden>メガシンカ</span>
          <span id="enemy-name"></span>
        </div>
        <div id="enemy-types" class="type-list"></div>
        <div class="enemy-ability">特性：<strong id="enemy-ability"></strong></div>
      </div>
      <div class="enemy-image-wrap">
        <img id="enemy-image" alt="">
      </div>
    </div>

    <div id="moves" class="moves"></div>

    <div id="feedback" class="feedback" hidden>
      <p id="feedback-title" class="feedback-title"></p>
      <p id="feedback-types" class="feedback-types"></p>
      <ul id="feedback-list" class="feedback-list"></ul>
      <button id="next-button" class="btn btn-primary">次へ</button>
    </div>

    <div id="quit-dialog" class="dialog-backdrop" hidden>
      <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="quit-title">
        <p id="quit-title" class="dialog-title">タイトルに戻りますか？</p>
        <p class="dialog-text">このゲームの記録は保存されません。</p>
        <div class="dialog-buttons">
          <button id="quit-cancel" class="btn">つづける</button>
          <button id="quit-ok" class="btn btn-primary">タイトルへ</button>
        </div>
      </div>
    </div>
  </section>

  <!-- 結果 -->
  <section id="screen-result" class="screen" hidden>
    <div class="title-box">
      <p id="result-label" class="result-label">タイプ相性偏差値</p>
      <p id="result-deviation" class="result-deviation">50</p>
      <p id="result-rank" class="result-rank"></p>
      <p id="result-score" class="result-score"></p>
      <p id="result-best" class="result-best"></p>
      <p id="result-caption" class="result-caption">※偏差値は想定した平均点・ばらつきから出した目安です</p>
      <div class="difficulty">
        <button id="retry-button" class="btn btn-primary">もう一度</button>
        <button id="title-button" class="btn">タイトルへ</button>
      </div>
    </div>
  </section>

  <script src="data/pokemon.js"></script>
  <script src="js/types.js"></script>
  <script src="js/moves.js"></script>
  <script src="js/abilities.js"></script>
  <script src="js/calc.js"></script>
  <script src="js/sound.js"></script>
  <script src="js/quiz.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
